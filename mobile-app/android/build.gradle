buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        kotlinVersion = "1.9.25"
        ndkVersion = "27.0.12077973"
        composeCompilerVersion = "1.5.15"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
        classpath("androidx.compose.compiler:compiler:$composeCompilerVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion "1.9.25"
                }
            }
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.25",
                  "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25",
                  "org.jetbrains.kotlin:kotlin-annotations-jvm:1.9.25"
        }
    }
}

subprojects {
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion "1.9.25"
                }
            }
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.25",
                  "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25",
                  "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25",
                  "org.jetbrains.kotlin:kotlin-annotations-jvm:1.9.25"
        }
    }
}